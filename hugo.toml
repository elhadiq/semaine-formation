baseURL = "https://info-cpge.men/"
languageCode = "fr-FR"
defaultContentLanguage = "fr"
title = "Info CPGE"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Informatique en classes préparatoires : formations, cours, ressources et actualités pour les enseignants."
  accroche = "Formations, cours, ressources et actualités pour les enseignants d'informatique des CPGE."
  # Dépôt GitHub "utilisateur/depot" : active les boutons « Ouvrir dans Colab » des notebooks.
  githubRepo = "elhadiq/semaine-formation"
  brancheGithub = "main"

# Menu principal (ordre = weight)
[[menus.main]]
  name = "Accueil"
  pageRef = "/"
  weight = 10
[[menus.main]]
  name = "Formations"
  pageRef = "/formations"
  weight = 20
[[menus.main]]
  name = "Cours"
  pageRef = "/cours"
  weight = 30
[[menus.main]]
  name = "Ressources"
  pageRef = "/ressources"
  weight = 40
[[menus.main]]
  name = "Actualités"
  pageRef = "/actualites"
  weight = 50

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true
